plugins {
    id 'fabric-loom' version '1.2-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

extra {
    apply {
        apply plugin: 'fabric-loom'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${minecraft_version}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:1.20.4+${loader_version}"
}

processResources {
    inputs.properties(file: 'src/main/resources/fabric.mod.json') { include '**/*.json' }
    from(sourceSets.main.resources.srcDirs) {
        include 'fabric.mod.json'
        include 'assets/**'
    }
}

loom {
    accessWidenerPath = file('src/main/resources/${archives_base_name}.accesswidener')
    remapModProcessSourcesProperties = false
}

jar {
    from {
        configurations.compileClasspath.get().filter { it.name.endsWith('jar') }.collect {
            zipTree(it)
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact jar
        }
    }
}